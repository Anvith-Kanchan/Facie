name: Build Facie APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Download Apache-2.0 MobileFaceNet TFLite model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            'https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/mobile_facenet/releases/v0.65.0/mobile_facenet-tflite-float.zip' \
            -o /tmp/mobilefacenet.zip
          unzip -l /tmp/mobilefacenet.zip
          unzip -o /tmp/mobilefacenet.zip -d /tmp/mobilefacenet
          MODEL="$(find /tmp/mobilefacenet -type f -name '*.tflite' | head -n 1)"
          test -n "$MODEL"
          cp "$MODEL" app/src/main/assets/mobilefacenet.tflite
          sha256sum app/src/main/assets/mobilefacenet.tflite
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: facie-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
